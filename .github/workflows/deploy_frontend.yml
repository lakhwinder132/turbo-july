name: Deploy the frontend

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v2

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile.frontend
          build-args: |
            DATABASE_URL= ${{secrets.DOCKERHUB_DATABASE}}
          push: true
          tags: lakhwinder97187/turbo-july-frontend:${{ github.sha }}
          ## step to deploy on virtual machine
      - name: Deploy to the VM
        run: |
          set -e
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/ssh_key
          chmod 600 ~/ssh_key

          printf '#!/bin/sh\necho "%s"\n' "${{ secrets.SSH_PASSPHRASE }}" > ~/askpass.sh
          chmod 700 ~/askpass.sh

          eval "$(ssh-agent -s)"
          export SSH_ASKPASS=~/askpass.sh
          export SSH_ASKPASS_REQUIRE=force
          setsid ssh-add ~/ssh_key < /dev/null

          ssh -o StrictHostKeyChecking=no -i ~/ssh_key azureuser@172.197.240.14 "
            docker stop frontend || true
            docker rm frontend || true
            docker run --name frontend -d -p 3000:3000 lakhwinder97187/turbo-july-frontend:${{ github.sha }}
          "

          rm -f ~/askpass.sh ~/ssh_key